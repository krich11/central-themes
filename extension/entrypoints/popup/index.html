<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Central Themes</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <div class="popup-head">
        <h1>Central Themes</h1>
        <div class="popup-meta">
          <span id="status" class="status"></span>
          <span id="version" class="version"></span>
        </div>
      </div>
      <span id="theme-label" class="field-label">Theme</span>
      <div class="theme-row">
        <div class="theme-menu">
          <button
            type="button"
            id="theme-toggle"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-labelledby="theme-label theme-current"
          >
            <span id="theme-current"></span>
            <span class="chevron" aria-hidden="true">▾</span>
          </button>
          <div id="theme-panel" class="theme-panel" role="listbox" hidden></div>
        </div>
        <button type="button" id="customize">Customize</button>
      </div>
      <div class="io-row">
        <button type="button" id="export">Export</button>
        <button type="button" id="import">Import</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
      </div>
      <p id="hint" class="hint"></p>
      <div id="create-row" class="create-row" hidden>
        <input
          id="profile-name"
          type="text"
          maxlength="40"
          placeholder="Profile name"
          autocomplete="off"
        />
        <button type="button" id="create-profile">Create</button>
        <button type="button" id="cancel-create">Cancel</button>
      </div>
      <p id="notice" class="hint notice" hidden></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
