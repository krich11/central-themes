<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Central Themes</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <div class="popup-head">
        <h1>Central Themes</h1>
        <div class="popup-meta">
          <span id="status" class="status"></span>
          <span id="version" class="version"></span>
        </div>
      </div>
      <label for="theme">Theme</label>
      <div class="theme-row">
        <select id="theme"></select>
        <button type="button" id="customize">Customize</button>
      </div>
      <div id="profile-list" class="profile-list" hidden></div>
      <p id="hint" class="hint"></p>
      <div id="create-row" class="create-row" hidden>
        <input
          id="profile-name"
          type="text"
          maxlength="40"
          placeholder="Profile name"
          autocomplete="off"
        />
        <button type="button" id="create-profile">Create</button>
        <button type="button" id="cancel-create">Cancel</button>
      </div>
      <p id="notice" class="hint notice" hidden></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
